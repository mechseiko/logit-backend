name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    name: API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The same file Render builds. A COPY of a path this repo does not have fails the deploy, and
      # nothing caught that until the image was built here.
      - name: Build the image Render uses
        run: docker build -f apps/api/Dockerfile -t logit-api:ci .
      - name: Boot it and check /health
        run: |
          docker run -d --name logit-api -p 4000:4000 \
            -e AUTH_MODE=dev -e STORE_DRIVER=memory -e AI_PROVIDER=mock \
            -e PAYMENTS_PROVIDER=mock -e STORAGE_DRIVER=local -e NODE_ENV=test \
            -e DEV_AUTH_SECRET=ci-only-secret-value-123456 \
            logit-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health; then exit 0; fi
            sleep 2
          done
          docker logs logit-api
          exit 1
      - name: Container logs
        if: always()
        run: docker logs logit-api || true
